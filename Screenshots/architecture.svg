<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
<path d="M0,0 L0,6 L8,3 z" fill="#8b949e"/></marker></defs>
<rect width="960" height="700" fill="#0d1117"/>
<g font-family="SF Mono,Menlo,monospace">
<text x="480" y="34" fill="#e6edf3" font-size="17" text-anchor="middle" font-weight="bold">ExactAssociationKit</text>
<text x="480" y="55" fill="#8b949e" font-size="12" text-anchor="middle">the&#160;interval&#160;every&#160;reading&#160;in&#160;this&#160;series&#160;has&#160;been&#160;quoting&#160;asymptotically</text>
<rect x="40" y="80" width="300" height="78" rx="6" fill="none" stroke="#79c0ff" stroke-width="1.6"/>
<text x="190" y="103" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">ExactBlock</text>
<text x="190" y="121" fill="#8b949e" font-size="11" text-anchor="middle">four&#160;whole&#160;counts,&#160;uncorrected&#160;&#8212;</text>
<text x="190" y="138" fill="#8b949e" font-size="11" text-anchor="middle">a&#160;zero&#160;is&#160;a&#160;count,&#160;not&#160;a&#160;defect</text>
<rect x="620" y="80" width="300" height="78" rx="6" fill="none" stroke="#f0883e" stroke-width="1.6"/>
<text x="770" y="103" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">MeasuredStructure</text>
<text x="770" y="121" fill="#8b949e" font-size="11" text-anchor="middle">AssociationTransportKit's&#160;Woolf</text>
<text x="770" y="138" fill="#8b949e" font-size="11" text-anchor="middle">reading&#160;&#8212;&#160;the&#160;thing&#160;being&#160;checked</text>
<rect x="40" y="190" width="300" height="96" rx="6" fill="none" stroke="#d2a8ff" stroke-width="1.6"/>
<text x="190" y="214" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">NoncentralHypergeometric</text>
<text x="190" y="233" fill="#8b949e" font-size="11" text-anchor="middle">the&#160;distribution&#160;of&#160;the&#160;top-left</text>
<text x="190" y="250" fill="#8b949e" font-size="11" text-anchor="middle">count&#160;once&#160;the&#160;margins&#160;are&#160;fixed;</text>
<text x="190" y="267" fill="#8b949e" font-size="11" text-anchor="middle">one&#160;parameter,&#160;finite&#160;support</text>
<path d="M190,158 L190,186" stroke="#8b949e" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="390" y="190" width="250" height="96" rx="6" fill="none" stroke="#3fb950" stroke-width="1.6"/>
<text x="515" y="214" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">RootSolver</text>
<text x="515" y="233" fill="#8b949e" font-size="11" text-anchor="middle">bisection&#160;on&#160;log&#160;psi&#160;&#8212;</text>
<text x="515" y="250" fill="#8b949e" font-size="11" text-anchor="middle">every&#160;quantity&#160;here&#160;is&#160;monotone</text>
<text x="515" y="267" fill="#8b949e" font-size="11" text-anchor="middle">and&#160;none&#160;has&#160;a&#160;closed&#160;form</text>
<path d="M386,238 L344,238" stroke="#8b949e" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="40" y="318" width="270" height="118" rx="6" fill="none" stroke="#79c0ff" stroke-width="1.6"/>
<text x="175" y="342" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">ConditionalOddsEstimate</text>
<text x="175" y="362" fill="#8b949e" font-size="11" text-anchor="middle">zero&#160;|&#160;finite&#160;|&#160;unbounded</text>
<text x="175" y="383" fill="#8b949e" font-size="11" text-anchor="middle">the&#160;odds&#160;ratio&#160;whose&#160;mean&#160;is</text>
<text x="175" y="400" fill="#8b949e" font-size="11" text-anchor="middle">the&#160;observed&#160;count&#160;&#8212;&#160;not&#160;ad/bc,</text>
<text x="175" y="417" fill="#8b949e" font-size="11" text-anchor="middle">which&#160;is&#160;biased&#160;away&#160;from&#160;1</text>
<path d="M140,290 L120,314" stroke="#8b949e" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="340" y="318" width="300" height="118" rx="6" fill="none" stroke="#79c0ff" stroke-width="1.6"/>
<text x="490" y="342" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">ExactInterval</text>
<text x="490" y="362" fill="#8b949e" font-size="11" text-anchor="middle">exact&#160;&#160;&#8212;&#160;invert&#160;two&#160;one-sided&#160;tests</text>
<text x="490" y="379" fill="#8b949e" font-size="11" text-anchor="middle">mid-p&#160;&#160;&#8212;&#160;the&#160;same,&#160;observed&#160;table&#160;halved</text>
<text x="490" y="396" fill="#8b949e" font-size="11" text-anchor="middle">Woolf&#160;&#160;&#8212;&#160;normal&#160;on&#160;the&#160;log&#160;scale</text>
<text x="490" y="419" fill="#8b949e" font-size="11" text-anchor="middle">0&#160;and&#160;inf&#160;are&#160;answers,&#160;not&#160;failures</text>
<path d="M240,290 L420,314" stroke="#8b949e" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="670" y="318" width="250" height="118" rx="6" fill="none" stroke="#d2a8ff" stroke-width="1.6"/>
<text x="795" y="342" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">ExactReading</text>
<text x="795" y="362" fill="#8b949e" font-size="11" text-anchor="middle">both&#160;intervals,&#160;both&#160;p-values,</text>
<text x="795" y="379" fill="#8b949e" font-size="11" text-anchor="middle">the&#160;estimate,&#160;the&#160;support&#160;size</text>
<text x="795" y="402" fill="#8b949e" font-size="11" text-anchor="middle">conservatism&#160;=&#160;how&#160;much&#160;the</text>
<text x="795" y="419" fill="#8b949e" font-size="11" text-anchor="middle">guarantee&#160;costs</text>
<path d="M644,377 L666,377" stroke="#8b949e" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="340" y="470" width="280" height="96" rx="6" fill="none" stroke="#f0883e" stroke-width="1.6"/>
<text x="480" y="494" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">WoolfComparison</text>
<text x="480" y="513" fill="#8b949e" font-size="11" text-anchor="middle">understatement&#160;=&#160;exact&#160;/&#160;Woolf</text>
<text x="480" y="530" fill="#8b949e" font-size="11" text-anchor="middle">log&#160;width;&#160;verdictAgrees;</text>
<text x="480" y="547" fill="#8b949e" font-size="11" text-anchor="middle">correctionWasRequired</text>
<path d="M770,158 L640,500" stroke="#8b949e" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<path d="M760,440 L600,466" stroke="#8b949e" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="40" y="470" width="270" height="96" rx="6" fill="none" stroke="#3fb950" stroke-width="1.6"/>
<text x="175" y="494" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">ExactAudit</text>
<text x="175" y="513" fill="#8b949e" font-size="11" text-anchor="middle">every&#160;block&#160;of&#160;a&#160;panel;</text>
<text x="175" y="530" fill="#8b949e" font-size="11" text-anchor="middle">degenerate&#160;blocks&#160;listed,</text>
<text x="175" y="547" fill="#8b949e" font-size="11" text-anchor="middle">not&#160;thrown</text>
<path d="M336,518 L314,518" stroke="#8b949e" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
<rect x="670" y="470" width="250" height="96" rx="6" fill="none" stroke="#79c0ff" stroke-width="1.6"/>
<text x="795" y="494" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">ExactLedger</text>
<text x="795" y="513" fill="#8b949e" font-size="11" text-anchor="middle">actor&#160;&#8212;&#160;keeps&#160;the&#160;audits&#160;so</text>
<text x="795" y="530" fill="#8b949e" font-size="11" text-anchor="middle">a&#160;run&#160;can&#160;be&#160;asked&#160;what&#160;it</text>
<text x="795" y="547" fill="#8b949e" font-size="11" text-anchor="middle">found&#160;overall</text>
<rect x="40" y="600" width="880" height="66" rx="6" fill="none" stroke="#f85149" stroke-width="1.6"/>
<text x="480" y="624" fill="#f85149" font-size="13" text-anchor="middle" font-weight="bold">Refusals</text>
<text x="480" y="645" fill="#8b949e" font-size="11" text-anchor="middle">negativeCount&#160;&#8212;&#160;degenerateSupport&#160;&#8212;&#160;alphaOutOfRange&#160;&#8212;&#160;blockOutOfRange&#160;&#8212;&#160;confidenceLevelMismatch</text>
</g>
</svg>
